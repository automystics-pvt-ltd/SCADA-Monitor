openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: platform-admin
    description: Isolated platform administration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /platform-admin/auth/user:
    get:
      operationId: getPlatformAdminAuthUser
      tags: [platform-admin]
      summary: Get the current platform admin session
      responses:
        "200":
          description: Current admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAdminAuthUserResponse"
  /platform-admin/overview:
    get:
      operationId: getPlatformAdminOverview
      tags: [platform-admin]
      summary: Get the platform administration overview
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAdminOverview"
        "401":
          description: Unauthorized
        "403":
          description: Platform admin access required
  /platform-admin/organizations:
    get:
      operationId: listPlatformOrganizations
      tags: [platform-admin]
      summary: List organizations
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformOrganization"
    post:
      operationId: createPlatformOrganization
      tags: [platform-admin]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformOrganizationInput"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganization"
  /platform-admin/sites:
    get:
      operationId: listPlatformSites
      tags: [platform-admin]
      summary: List sites
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformSite"
    post:
      operationId: createPlatformSite
      tags: [platform-admin]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteInput"
      responses:
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSite"
    patch:
      operationId: updatePlatformSite
      tags: [platform-admin]
      summary: Update a managed site and its location
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteUpdateInput"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSite"
        "400":
          description: Invalid site update
        "404":
          description: Site or organization not found
        "409":
          description: Site update conflicts with an existing record
  /platform-admin/sites/activation:
    post:
      operationId: updatePlatformSiteActivation
      tags: [platform-admin]
      summary: Explicitly activate or deactivate a managed site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteActivationInput"
      responses:
        "200":
          description: Updated site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSite"
        "400":
          description: Invalid activation request or telemetry verification required
        "404":
          description: Site not found
  /platform-admin/telemetry/devices:
    get:
      operationId: listPlatformTelemetryDevices
      tags: [platform-admin]
      summary: List source-backed devices observed in live telemetry
      responses:
        "200":
          description: Observed telemetry devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformTelemetryDevice"
  /platform-admin/telemetry/parameters:
    get:
      operationId: listPlatformTelemetryParameters
      tags: [platform-admin]
      summary: List latest source-backed parameter evidence for a managed site
      parameters:
        - $ref: "#/components/parameters/PlatformTelemetrySiteName"
        - $ref: "#/components/parameters/PlatformTelemetryDeviceIdOptional"
      responses:
        "200":
          description: Latest received parameters and any saved semantic mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTelemetryParameterList"
        "400":
          description: Invalid site or source selection
        "404":
          description: Managed site not found
  /platform-admin/telemetry/mappings:
    get:
      operationId: listPlatformTelemetryMappings
      tags: [platform-admin]
      summary: List saved telemetry mappings for a managed site
      parameters:
        - $ref: "#/components/parameters/PlatformTelemetrySiteName"
        - $ref: "#/components/parameters/PlatformTelemetryDeviceIdOptional"
      responses:
        "200":
          description: Saved mappings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformTelemetryMapping"
    put:
      operationId: upsertPlatformTelemetryMapping
      tags: [platform-admin]
      summary: Create or update a source-scoped semantic telemetry mapping
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformTelemetryMappingInput"
      responses:
        "200":
          description: Saved mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTelemetryMapping"
        "400":
          description: Invalid or no-longer-observed source evidence
        "404":
          description: Managed site not found
  /platform-admin/telemetry/mappings/clear:
    post:
      operationId: clearPlatformTelemetryMapping
      tags: [platform-admin]
      summary: Clear a saved telemetry mapping while retaining its audit history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformTelemetryMappingIdentity"
      responses:
        "200":
          description: Cleared mapping
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTelemetryMapping"
        "404":
          description: Mapping not found
  /platform-admin/telemetry/snapshot-gaps:
    get:
      operationId: listPlatformTelemetrySnapshotGapSummaries
      tags: [platform-admin]
      summary: List recent scheduled-save gap counts across all active managed sites
      responses:
        "200":
          description: Recent snapshot-gap summary per active managed site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTelemetrySnapshotGapSummaryList"
  /platform-admin/telemetry/snapshot-gaps/detail:
    get:
      operationId: getPlatformTelemetrySnapshotGapDetail
      tags: [platform-admin]
      summary: Get scheduled-save gap detail for a single active managed site
      parameters:
        - $ref: "#/components/parameters/PlatformTelemetrySiteName"
        - name: from
          in: query
          required: false
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: false
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Scheduled-save gap detail for the selected site and range
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTelemetrySnapshotGapDetail"
        "400":
          description: Invalid site or gap-check range
        "404":
          description: Managed site not found
  /platform-admin/telemetry-tests:
    post:
      operationId: createPlatformTelemetryTest
      tags: [platform-admin]
      summary: Run a bounded live telemetry test against a selected device
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformTelemetryTestInput"
      responses:
        "200":
          description: Completed telemetry test
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformTelemetryTest"
        "400":
          description: Site or device is not currently available for testing
  /platform-admin/users:
    get:
      operationId: listPlatformUsers
      tags: [platform-admin]
      summary: List SCADA users and site access
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"
    post:
      operationId: createPlatformUser
      tags: [platform-admin]
      summary: Provision a SCADA user with organization and site assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUserInput"
      responses:
        "201":
          description: Provisioned user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
    patch:
      operationId: updatePlatformUser
      tags: [platform-admin]
      summary: Update a SCADA user profile and assignments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUserUpdateInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
  /platform-admin/users/status:
    post:
      operationId: updatePlatformUserStatus
      tags: [platform-admin]
      summary: Activate, deactivate, delete, or recover a SCADA account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformUserStatusInput"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUser"
  /platform-admin/role-permissions:
    get:
      operationId: getPlatformRolePermissions
      tags: [platform-admin]
      summary: Get configurable SCADA role permissions
      responses:
        "200":
          description: Role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformRolePermissions"
    patch:
      operationId: updatePlatformRolePermissions
      tags: [platform-admin]
      summary: Update configurable SCADA role permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformRolePermissions"
      responses:
        "200":
          description: Updated role permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformRolePermissions"
  /platform-admin/access:
    post:
      operationId: grantPlatformSiteAccess
      tags: [platform-admin]
      summary: Grant a user access to a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteAccessInput"
      responses:
        "201":
          description: Access grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSiteAccess"
    patch:
      operationId: updatePlatformSiteAccess
      tags: [platform-admin]
      summary: Update or revoke a user's site access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteAccessUpdateInput"
      responses:
        "200":
          description: Updated access grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSiteAccess"
  /platform-admin/mqtt-config:
    get:
      operationId: getPlatformMqttConfig
      tags: [platform-admin]
      summary: Get safe MQTT configuration
      responses:
        "200":
          description: Safe MQTT configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
    patch:
      operationId: updatePlatformMqttConfig
      tags: [platform-admin]
      summary: Update non-secret MQTT configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformMqttConfigInput"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
    post:
      operationId: applyPlatformMqttConfig
      tags: [platform-admin]
      summary: Apply staged MQTT configuration to the live consumer
      responses:
        "200":
          description: Configuration applied and subscription confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
        "502":
          description: Apply failed and previous settings were restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
  /platform-admin/audit:
    get:
      operationId: listPlatformAuditEvents
      tags: [platform-admin]
      summary: List platform audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformAuditEvent"
  /platform-admin/database/health:
    get:
      operationId: getPlatformDatabaseHealth
      tags: [platform-admin]
      summary: Check platform database health
      responses:
        "200":
          description: Database health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseHealth"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseHealth"
  /platform-admin/database/tables:
    get:
      operationId: listPlatformDatabaseTables
      tags: [platform-admin]
      summary: List approved application tables
      responses:
        "200":
          description: Approved tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformDatabaseTable"
  /platform-admin/database/rows:
    post:
      operationId: browsePlatformDatabaseTable
      tags: [platform-admin]
      summary: Browse approved application table records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformDatabaseRowsInput"
      responses:
        "200":
          description: Paged records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseRows"
  /platform-admin/database/migrations:
    get:
      operationId: getPlatformDatabaseMigrations
      tags: [platform-admin]
      summary: View platform schema status
      responses:
        "200":
          description: Schema status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseMigrations"
  /platform-admin/database/backup:
    get:
      operationId: downloadPlatformDatabaseBackup
      tags: [platform-admin]
      summary: Download an audited application-data backup
      responses:
        "200":
          description: JSON application-data export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Backup unavailable
  /platform-admin/database/query:
    post:
      operationId: runPlatformDatabaseQuery
      tags: [platform-admin]
      summary: Run a constrained read-only database query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformDatabaseQueryInput"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseQueryResult"
        "400":
          description: Query rejected
        "408":
          description: Query timed out
        "413":
          description: Result too large
components:
  parameters:
    PlatformTelemetrySiteName:
      name: siteName
      in: query
      required: true
      schema: { type: string, minLength: 2, maxLength: 160 }
    PlatformTelemetryDeviceIdOptional:
      name: deviceId
      in: query
      required: false
      schema: { type: string, minLength: 1, maxLength: 160 }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PlatformAdminAuthUserResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/PlatformAdminUser"
            - type: "null"
        admin:
          type: boolean
      required: [user, admin]
    PlatformAdminUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
      required: [id, email, name, role]
    PlatformAdminOverview:
      type: object
      properties:
        organizationCount: { type: number }
        siteCount: { type: number }
        userCount: { type: number }
        activeAccessGrantCount: { type: number }
        broker:
          $ref: "#/components/schemas/PlatformMqttConfig"
        communication:
          type: object
          additionalProperties: true
        recentAudit:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAuditEvent"
      required: [organizationCount, siteCount, userCount, activeAccessGrantCount, broker, communication, recentAudit]
    PlatformOrganization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        siteCount: { type: number }
      required: [id, name, slug, status, siteCount]
    PlatformOrganizationInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, minLength: 2, maxLength: 80 }
      required: [name, slug]
    PlatformSite:
      type: object
      properties:
        siteName: { type: string }
        organizationId: { type: string }
        organizationName: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        timezone: { type: string }
        status: { type: string }
        activationStatus: { type: string, enum: [active, inactive] }
        lastTelemetryTestedAt: { type: [string, "null"], format: date-time }
        lastTelemetryTestResult: { type: [string, "null"], enum: [success, no-telemetry, error] }
      required: [siteName, organizationId, organizationName, latitude, longitude, timezone, status, activationStatus, lastTelemetryTestedAt, lastTelemetryTestResult]
    PlatformSiteInput:
      type: object
      properties:
        siteName: { type: string, minLength: 2, maxLength: 160 }
        organizationId: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        timezone: { type: string, maxLength: 80 }
      required: [siteName, organizationId, timezone]
    PlatformSiteUpdateInput:
      type: object
      properties:
        siteName: { type: string, minLength: 2, maxLength: 160 }
        organizationId: { type: string }
        timezone: { type: string, minLength: 1, maxLength: 80 }
        latitude: { type: [number, "null"], minimum: -90, maximum: 90 }
        longitude: { type: [number, "null"], minimum: -180, maximum: 180 }
      required: [siteName]
    PlatformSiteActivationInput:
      type: object
      properties:
        siteName: { type: string, minLength: 2, maxLength: 160 }
        activationStatus: { type: string, enum: [active, inactive] }
      required: [siteName, activationStatus]
    PlatformTelemetryDevice:
      type: object
      properties:
        siteName: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        lastReceivedAt: { type: string, format: date-time }
      required: [siteName, deviceId, deviceName, lastReceivedAt]
    PlatformTelemetryDestination:
      type: string
      enum: [inverter-identity, active-power, daily-energy, total-energy, specific-yield, voltage, current, frequency, environmental, alarm, fault, communication, data-quality, discovered-other]
    PlatformTelemetryMapping:
      type: object
      properties:
        id: { type: string }
        siteName: { type: string }
        deviceId: { type: string }
        sourceIdentity: { type: string }
        sourceName: { type: string }
        normalizedName: { type: string }
        address: { type: string }
        destination: { $ref: "#/components/schemas/PlatformTelemetryDestination" }
        displayLabel: { type: string }
        category: { type: string }
        inverterIdentity: { type: [string, "null"] }
        sourceUnit: { type: [string, "null"] }
        displayUnit: { type: [string, "null"] }
        scalingMultiplier: { type: number }
        scalingOffset: { type: number }
        scalingStatus: { type: string, enum: [approved] }
        status: { type: string, enum: [active, cleared] }
        version: { type: number, multipleOf: 1 }
        updatedAt: { type: string, format: date-time }
      required: [id, siteName, deviceId, sourceIdentity, sourceName, normalizedName, address, destination, displayLabel, category, inverterIdentity, sourceUnit, displayUnit, scalingMultiplier, scalingOffset, scalingStatus, status, version, updatedAt]
    PlatformTelemetryMappingIdentity:
      type: object
      properties:
        siteName: { type: string, minLength: 2, maxLength: 160 }
        deviceId: { type: string, minLength: 1, maxLength: 160 }
        sourceIdentity: { type: string, minLength: 1, maxLength: 1000 }
        normalizedName: { type: string, minLength: 1, maxLength: 240 }
        address: { type: string, maxLength: 240 }
      required: [siteName, deviceId, sourceIdentity, normalizedName, address]
    PlatformTelemetryMappingInput:
      allOf:
        - $ref: "#/components/schemas/PlatformTelemetryMappingIdentity"
        - type: object
          properties:
            destination: { $ref: "#/components/schemas/PlatformTelemetryDestination" }
            displayLabel: { type: string, minLength: 1, maxLength: 240 }
            category: { type: string, minLength: 1, maxLength: 120 }
            inverterIdentity: { type: [string, "null"], maxLength: 80 }
            sourceUnit: { type: [string, "null"], maxLength: 80 }
            displayUnit: { type: [string, "null"], maxLength: 80 }
            scalingMultiplier: { type: number, minimum: -1000000000, maximum: 1000000000, default: 1 }
            scalingOffset: { type: number, minimum: -1000000000, maximum: 1000000000, default: 0 }
          required: [destination, displayLabel, category, displayUnit, scalingMultiplier, scalingOffset]
    PlatformTelemetryParameter:
      type: object
      properties:
        observationId: { type: string }
        signalKey: { type: string }
        siteName: { type: string }
        deviceId: { type: string }
        deviceName: { type: string }
        topic: { type: string }
        originalName: { type: string }
        normalizedName: { type: string }
        displayLabel: { type: string }
        category: { type: string }
        evidenceAvailable: { type: boolean }
        rawValue: { type: [string, "null"] }
        reportedValue: { type: [string, "null"] }
        reportedNumericValue: { type: [number, "null"] }
        displayValue: { type: [string, "null"] }
        displayNumericValue: { type: [number, "null"] }
        displayUnit: { type: [string, "null"] }
        sourceUnit: { type: [string, "null"] }
        address: { type: [string, "null"] }
        sourceName: { type: string }
        sourceIdentity: { type: string }
        observedAt: { type: [string, "null"], format: date-time }
        receivedAt: { type: [string, "null"], format: date-time }
        provenance: { type: string, enum: [live, retained, recovered, replay, snapshot, configuration] }
        dataQuality: { type: string, enum: [validated, raw, source-reported] }
        scalingStatus: { type: string, enum: [validated, raw] }
        mappingValidationStatus: { type: [string, "null"], enum: [valid, not-numeric, non-finite, null] }
        observationCount: { type: number, minimum: 0, multipleOf: 1 }
        mappingLifecycleStatus: { type: string, enum: [unmapped, mapped] }
        firstSeenAt: { type: [string, "null"], format: date-time }
        lastSeenAt: { type: [string, "null"], format: date-time }
        freshness: { type: string, enum: [live, stale, saved, retained, recovered, replay] }
        mapping: { anyOf: [{ $ref: "#/components/schemas/PlatformTelemetryMapping" }, { type: "null" }] }
      required: [observationId, signalKey, siteName, deviceId, deviceName, topic, originalName, normalizedName, displayLabel, category, evidenceAvailable, rawValue, reportedValue, reportedNumericValue, displayValue, displayNumericValue, displayUnit, sourceUnit, address, sourceName, sourceIdentity, observedAt, receivedAt, provenance, dataQuality, scalingStatus, mappingValidationStatus, observationCount, mappingLifecycleStatus, firstSeenAt, lastSeenAt, freshness, mapping]
    PlatformTelemetryMappingPrecedent:
      type: object
      description: A minimal projection of another active mapping (any site or device) offered as auto-suggestion precedent. It never activates anything by itself.
      properties:
        siteName: { type: string }
        deviceId: { type: string }
        sourceName: { type: string }
        normalizedName: { type: string }
        address: { type: [string, "null"] }
        destination: { $ref: "#/components/schemas/PlatformTelemetryDestination" }
        displayLabel: { type: string }
        category: { type: string }
        inverterIdentity: { type: [string, "null"] }
        sourceUnit: { type: [string, "null"] }
        displayUnit: { type: [string, "null"] }
        scalingMultiplier: { type: number }
        scalingOffset: { type: number }
        updatedAt: { type: string, format: date-time }
      required: [siteName, deviceId, sourceName, normalizedName, address, destination, displayLabel, category, inverterIdentity, sourceUnit, displayUnit, scalingMultiplier, scalingOffset, updatedAt]
    PlatformTelemetryParameterList:
      type: object
      properties:
        siteName: { type: string }
        deviceId: { type: [string, "null"] }
        parameters:
          type: array
          items: { $ref: "#/components/schemas/PlatformTelemetryParameter" }
        precedentMappings:
          type: array
