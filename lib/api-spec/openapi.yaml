openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: platform-admin
    description: Isolated platform administration operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /platform-admin/auth/user:
    get:
      operationId: getPlatformAdminAuthUser
      tags: [platform-admin]
      summary: Get the current platform admin session
      responses:
        "200":
          description: Current admin session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAdminAuthUserResponse"
  /platform-admin/overview:
    get:
      operationId: getPlatformAdminOverview
      tags: [platform-admin]
      summary: Get the platform administration overview
      responses:
        "200":
          description: Platform overview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformAdminOverview"
        "401":
          description: Unauthorized
        "403":
          description: Platform admin access required
  /platform-admin/organizations:
    get:
      operationId: listPlatformOrganizations
      tags: [platform-admin]
      summary: List organizations
      responses:
        "200":
          description: Organizations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformOrganization"
    post:
      operationId: createPlatformOrganization
      tags: [platform-admin]
      summary: Create an organization
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformOrganizationInput"
      responses:
        "201":
          description: Created organization
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformOrganization"
  /platform-admin/sites:
    get:
      operationId: listPlatformSites
      tags: [platform-admin]
      summary: List sites
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformSite"
    post:
      operationId: createPlatformSite
      tags: [platform-admin]
      summary: Create a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteInput"
      responses:
        "201":
          description: Created site
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSite"
  /platform-admin/users:
    get:
      operationId: listPlatformUsers
      tags: [platform-admin]
      summary: List SCADA users and site access
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUser"
  /platform-admin/access:
    post:
      operationId: grantPlatformSiteAccess
      tags: [platform-admin]
      summary: Grant a user access to a site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteAccessInput"
      responses:
        "201":
          description: Access grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSiteAccess"
    patch:
      operationId: updatePlatformSiteAccess
      tags: [platform-admin]
      summary: Update or revoke a user's site access
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformSiteAccessUpdateInput"
      responses:
        "200":
          description: Updated access grant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformSiteAccess"
  /platform-admin/mqtt-config:
    get:
      operationId: getPlatformMqttConfig
      tags: [platform-admin]
      summary: Get safe MQTT configuration
      responses:
        "200":
          description: Safe MQTT configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
    patch:
      operationId: updatePlatformMqttConfig
      tags: [platform-admin]
      summary: Update non-secret MQTT configuration
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformMqttConfigInput"
      responses:
        "200":
          description: Updated configuration
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
    post:
      operationId: applyPlatformMqttConfig
      tags: [platform-admin]
      summary: Apply staged MQTT configuration to the live consumer
      responses:
        "200":
          description: Configuration applied and subscription confirmed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
        "502":
          description: Apply failed and previous settings were restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformMqttConfig"
  /platform-admin/audit:
    get:
      operationId: listPlatformAuditEvents
      tags: [platform-admin]
      summary: List platform audit events
      responses:
        "200":
          description: Audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformAuditEvent"
  /platform-admin/database/health:
    get:
      operationId: getPlatformDatabaseHealth
      tags: [platform-admin]
      summary: Check platform database health
      responses:
        "200":
          description: Database health
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseHealth"
        "503":
          description: Database unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseHealth"
  /platform-admin/database/tables:
    get:
      operationId: listPlatformDatabaseTables
      tags: [platform-admin]
      summary: List approved application tables
      responses:
        "200":
          description: Approved tables
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformDatabaseTable"
  /platform-admin/database/rows:
    post:
      operationId: browsePlatformDatabaseTable
      tags: [platform-admin]
      summary: Browse approved application table records
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformDatabaseRowsInput"
      responses:
        "200":
          description: Paged records
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseRows"
  /platform-admin/database/migrations:
    get:
      operationId: getPlatformDatabaseMigrations
      tags: [platform-admin]
      summary: View platform schema status
      responses:
        "200":
          description: Schema status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseMigrations"
  /platform-admin/database/backup:
    get:
      operationId: downloadPlatformDatabaseBackup
      tags: [platform-admin]
      summary: Download an audited application-data backup
      responses:
        "200":
          description: JSON application-data export
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "503":
          description: Backup unavailable
  /platform-admin/database/query:
    post:
      operationId: runPlatformDatabaseQuery
      tags: [platform-admin]
      summary: Run a constrained read-only database query
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PlatformDatabaseQueryInput"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformDatabaseQueryResult"
        "400":
          description: Query rejected
        "408":
          description: Query timed out
        "413":
          description: Result too large
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PlatformAdminAuthUserResponse:
      type: object
      properties:
        user:
          oneOf:
            - $ref: "#/components/schemas/PlatformAdminUser"
            - type: "null"
        admin:
          type: boolean
      required: [user, admin]
    PlatformAdminUser:
      type: object
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: string }
        role: { type: string }
      required: [id, email, name, role]
    PlatformAdminOverview:
      type: object
      properties:
        organizationCount: { type: number }
        siteCount: { type: number }
        userCount: { type: number }
        activeAccessGrantCount: { type: number }
        broker:
          $ref: "#/components/schemas/PlatformMqttConfig"
        communication:
          type: object
          additionalProperties: true
        recentAudit:
          type: array
          items:
            $ref: "#/components/schemas/PlatformAuditEvent"
      required: [organizationCount, siteCount, userCount, activeAccessGrantCount, broker, communication, recentAudit]
    PlatformOrganization:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        slug: { type: string }
        status: { type: string }
        siteCount: { type: number }
      required: [id, name, slug, status, siteCount]
    PlatformOrganizationInput:
      type: object
      properties:
        name: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, minLength: 2, maxLength: 80 }
      required: [name, slug]
    PlatformSite:
      type: object
      properties:
        siteName: { type: string }
        organizationId: { type: string }
        organizationName: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        timezone: { type: string }
        status: { type: string }
      required: [siteName, organizationId, organizationName, latitude, longitude, timezone, status]
    PlatformSiteInput:
      type: object
      properties:
        siteName: { type: string, minLength: 2, maxLength: 160 }
        organizationId: { type: string }
        latitude: { type: [number, "null"] }
        longitude: { type: [number, "null"] }
        timezone: { type: string, maxLength: 80 }
      required: [siteName, organizationId, timezone]
    PlatformUser:
      type: object
      properties:
        id: { type: string }
        email: { type: [string, "null"] }
        name: { type: string }
        access:
          type: array
          items:
            $ref: "#/components/schemas/PlatformSiteAccess"
      required: [id, email, name, access]
    PlatformSiteAccess:
      type: object
      properties:
        userId: { type: string }
        siteName: { type: string }
        organizationId: { type: string }
        role: { type: string }
        status: { type: string }
      required: [userId, siteName, organizationId, role, status]
    PlatformSiteAccessInput:
      type: object
      properties:
        userId: { type: string }
        siteName: { type: string }
        role: { type: string, enum: [viewer, operator, site-admin] }
      required: [userId, siteName, role]
    PlatformMqttConfig:
      type: object
      properties:
        brokerUrl: { type: string }
        topic: { type: string }
        plantSite: { type: string }
        timezone: { type: string }
        credentialsConfigured: { type: boolean }
        pendingApply: { type: boolean }
        applyState: { type: string, enum: [idle, connecting, subscribed, rolling-back, failed] }
        lastApplyError: { type: string }
        lastApplyAt: { type: string, format: date-time }
        connected: { type: boolean }
      required: [brokerUrl, topic, plantSite, timezone, credentialsConfigured, pendingApply, applyState, connected]
    PlatformMqttConfigInput:
      type: object
      properties:
        brokerUrl: { type: string, minLength: 8, maxLength: 300 }
        topic: { type: string, minLength: 1, maxLength: 300 }
        plantSite: { type: string, minLength: 1, maxLength: 160 }
        timezone: { type: string, minLength: 1, maxLength: 80 }
      required: [brokerUrl, topic, plantSite, timezone]
    PlatformAuditEvent:
      type: object
      properties:
        id: { type: string }
        actorEmail: { type: string }
        action: { type: string }
        targetType: { type: string }
        targetId: { type: string }
        createdAt: { type: string, format: date-time }
        metadata:
          type: object
          additionalProperties: true
      required: [id, actorEmail, action, targetType, targetId, createdAt, metadata]
    PlatformSiteAccessUpdateInput:
      type: object
      properties:
        userId: { type: string }
        siteName: { type: string }
        role: { type: string, enum: [viewer, operator, site-admin] }
        status: { type: string, enum: [active, revoked] }
      required: [userId, siteName, role, status]
    PlatformDatabaseHealth:
      type: object
      properties:
        status: { type: string, enum: [ok, degraded] }
        latencyMs: { type: number }
        database: { type: string }
        schema: { type: string }
        checkedAt: { type: string, format: date-time }
        message: { type: string }
      required: [status, latencyMs, database, schema, checkedAt]
    PlatformDatabaseTable:
      type: object
      properties:
        name: { type: string }
        label: { type: string }
        description: { type: string }
        recordCount: { type: number }
        columns:
          type: array
          items:
            $ref: "#/components/schemas/PlatformDatabaseColumn"
      required: [name, label, description, recordCount, columns]
    PlatformDatabaseColumn:
      type: object
      properties:
        name: { type: string }
        type: { type: string }
        nullable: { type: boolean }
      required: [name, type, nullable]
    PlatformDatabaseRows:
      type: object
      properties:
        table:
          $ref: "#/components/schemas/PlatformDatabaseTable"
        page: { type: number }
        pageSize: { type: number }
        totalRecords: { type: number }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
      required: [table, page, pageSize, totalRecords, rows]
    PlatformDatabaseRowsInput:
      type: object
      properties:
        tableName: { type: string }
        page: { type: number, minimum: 1, default: 1 }
        pageSize: { type: number, minimum: 1, maximum: 200, default: 50 }
        search: { type: string, maxLength: 80 }
      required: [tableName]
    PlatformDatabaseMigration:
      type: object
      properties:
        name: { type: string }
        status: { type: string, enum: [available, present, missing] }
      required: [name, status]
    PlatformDatabaseMigrations:
      type: object
      properties:
        status: { type: string, enum: [ready, degraded] }
        latest: { type: string }
        expectedTables: { type: number }
        presentTables: { type: number }
        migrations:
          type: array
          items:
            $ref: "#/components/schemas/PlatformDatabaseMigration"
        checkedAt: { type: string, format: date-time }
      required: [status, latest, expectedTables, presentTables, migrations, checkedAt]
    PlatformDatabaseQueryInput:
      type: object
      properties:
        query: { type: string, minLength: 1, maxLength: 5000 }
      required: [query]
    PlatformDatabaseQueryResult:
      type: object
      properties:
        columns:
          type: array
          items: { type: string }
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        rowCount: { type: number }
        truncated: { type: boolean }
        durationMs: { type: number }
      required: [columns, rows, rowCount, truncated, durationMs]

