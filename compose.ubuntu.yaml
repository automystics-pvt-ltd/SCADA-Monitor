services:
  gateway:
    build:
      target: gateway-ubuntu
    environment:
      PUBLIC_DOMAIN: ${PUBLIC_DOMAIN:?Set PUBLIC_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    healthcheck:
      disable: true

  api:
    environment:
      MQTT_BROKER_URL: ${MQTT_BROKER_URL:?Set MQTT_BROKER_URL in .env}
      MQTT_TOPIC: ${MQTT_TOPIC:?Set MQTT_TOPIC in .env}
      MQTT_PLANT_SITE: ${MQTT_PLANT_SITE:?Set MQTT_PLANT_SITE in .env}
      PLATFORM_ADMIN_EMAILS: ${PLATFORM_ADMIN_EMAILS:?Set PLATFORM_ADMIN_EMAILS in .env}
      PLATFORM_ADMIN_GOOGLE_CLIENT_ID: ${PLATFORM_ADMIN_GOOGLE_CLIENT_ID:?Set PLATFORM_ADMIN_GOOGLE_CLIENT_ID in .env}
      PLATFORM_ADMIN_GOOGLE_CLIENT_SECRET: ${PLATFORM_ADMIN_GOOGLE_CLIENT_SECRET:?Set PLATFORM_ADMIN_GOOGLE_CLIENT_SECRET in .env}
      PLATFORM_ADMIN_SMTP_USERNAME: ${PLATFORM_ADMIN_SMTP_USERNAME:?Set PLATFORM_ADMIN_SMTP_USERNAME in .env}
      PLATFORM_ADMIN_SMTP_PASSWORD: ${PLATFORM_ADMIN_SMTP_PASSWORD:?Set PLATFORM_ADMIN_SMTP_PASSWORD in .env}

volumes:
  caddy-data:
  caddy-config:

# Keep these named volumes when updating the application.